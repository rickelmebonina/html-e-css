<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>
    <style>
        div {
            display: inline-block;
            border: 1px solid black;
            height: 200px;
            width: 200px;
            background-color: lightblue;
            text-align: center;
        }
        /*O div:hover é um exemplo de pseudo-classe, ou seja, é um estado do elemento, nesse caso, quando o mouse estiver sobre o elemento, ele irá mudar a cor de fundo para verde claro.*/
        
        div:hover {
            background-color: lightgreen;
        }
    </style>
</head>

<body>
    <div id="1">01</div>
    <div id="2">02</div>
    <div id="3">03</div>
</body>

</html>
