<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 {
            /*box level */
            background-color: lightblue;
            height: 300px;
            width: 300px;
            margin: auto;
            border: 10px solid aquamarine;
            padding: 10px;
        }
        
        a {
            /*inline level */
            border: 10px solid blueviolet;
        }
    </style>
</head>

<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Paragrafos tambem sao exemplos de box-level, mas os
        <a href="#">links sao exemplos de box inline-level</a>Vamos ver como tudo isso funciona.
    </p>
</body>

</html>
