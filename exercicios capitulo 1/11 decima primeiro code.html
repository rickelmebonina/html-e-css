<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>

<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em varios dispositivos diferentes ou simplemente aumente a e diminua o tamanho do seu navegado
    </p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/fotop.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/fotom.png" type="image/png">
        <img src="imagens/fotog.png" alt="Imagem flexível">
    </picture>
    <h1>Reproduzindo audios em html</h1>
    <p>Vamos aprender a produzir audios em html</p>
    <audio src="midia/muchas-graças-afison.mp3" autoplay controls></audio>
    <h1>outra maneira</h1>
    <audio preload="metadata" autoplay controls loop>
        <source src="midia/muchas-graças-afison.mp3" type="audio/mpeg">
    </audio>
</body>

</html>
