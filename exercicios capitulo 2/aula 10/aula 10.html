<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            /*font/Clarendon Heavy Regular.otf*/
            font-family: 'Clarendon Heavy';
            src: url(Clarendon\ Heavy\ Regular.otf) format(), url(Clarendon\ Heavy\ Regular.ttf) format();
            font-weight: normal;
            font-style: normal;
            /*tipor de fonte
            opentype (otf)
            truetype (ttf)
            embedded open type (eot)
            truetype-aat (Apple Advanced Typography)
            svg (scalable vector graphics)*/
        }
        
        body {
            font-family: 'Arial', sans-serif;
        }
        
        h1 {
            font-family: 'Clarendon Heavy', serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<!--HTML=class e em CSS=.
EM HTML id que em CSS #-->

<body>
    <h1>Titulo</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Sed veniam consectetur iusto, quod minima labore in temporibus. Veritatis debitis eius animi sapiente soluta libero ab. Rerum, facilis eligendi. Nulla, minus!
    </p>
</body>

</html>
